name: NotiMess tick

on:
  schedule:
    # Best-effort only -- GitHub throttles/delays `schedule` heavily on
    # low-activity repos (observed: 3 runs in ~14h instead of ~168, with a
    # 4+ hour gap that caused a missed breakfast notification). The real
    # trigger is an external cron (cron-job.org) calling the
    # workflow_dispatch REST API below every 5 minutes -- see ARCHITECTURE.md
    # §3.3. This schedule stays only as a free redundant fallback.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: notimess-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Poll subscribers + send any due notifications
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python tick.py

      - name: Commit subscriber state, if changed
        run: |
          if ! git diff --quiet -- data/subscribers.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/subscribers.json
            git commit -m "chore: update subscriber state"
            git pull --rebase origin main
            git push
          fi
